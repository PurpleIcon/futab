# The FuTab user manual, built with mdBook and published to GitHub Pages
# by .github/workflows/docs.yml. Build it locally with: mdbook build docs/manual
# (the pages land in docs/manual/book/, which git ignores).

[book]
title = "FuTab manual"
authors = ["Mateus Rocha de Paula", "The OxiGuitar contributors", "The FuTab contributors"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/PurpleIcon/futab"
edit-url-template = "https://github.com/PurpleIcon/futab/edit/develop/docs/manual/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true

[output.html.search]
enable = true
